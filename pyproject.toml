[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronomap"
dynamic = ["version"]
description = "A thread-safe, time-versioned key-value store for Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Devansh Singh" }]
keywords = [
    "asyncio",
    "database",
    "history",
    "key-value",
    "time-series",
    "ttl",
    "versioned",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
chronomap = "chronomap.cli:main"

[project.urls]
Homepage = "https://github.com/Chronomap-org/Chronomap"
Repository = "https://github.com/Chronomap-org/Chronomap"
Issues = "https://github.com/Chronomap-org/Chronomap/issues"
Changelog = "https://github.com/Chronomap-org/Chronomap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
]

[tool.setuptools.dynamic]
version = { attr = "chronomap._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronomap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "core: core ChronoMap read/write/query/merge/history behavior",
    "cache: LRUCache-specific tests",
    "lock: RWLock / thread-safety / concurrency tests",
    "memory: memory monitoring / estimation tests",
    "ttl: TTL expiry and background cleanup thread tests",
    "snapshot: snapshot, rollback, and diff tests",
    "persistence: versioned archive and codec tests",
    "async_map: AsyncChronoMap tests",
    "cli: command-line interface tests",
    "query: fluent value and version query tests",
]

[tool.black]
line-length = 110
target-version = ["py38"]
