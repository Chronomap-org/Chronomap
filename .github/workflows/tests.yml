name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      markers: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'src/chronomap/core.py'
              - 'src/chronomap/__init__.py'
              - 'src/chronomap/__main__.py'
              - 'src/chronomap/exceptions.py'
              - 'src/chronomap/_cache.py'
              - 'src/chronomap/_snapshot.py'
              - 'tests/test_chronomap.py'
              - 'tests/test_basic.py'
              - 'tests/test_coverage_gaps.py'
              - 'tests/test_core_correctness.py'
              - 'tests/test_module_entry.py'
            cache:
              - 'src/chronomap/_cache.py'
              - 'tests/test_core_correctness.py'
            lock:
              - 'src/chronomap/_lock.py'
            memory:
              - 'src/chronomap/_memory.py'
              - 'tests/test_memory_guardrails.py'
            ttl:
              - 'src/chronomap/_ttl_cleanup.py'
              - 'tests/test_core_correctness.py'
            snapshot:
              - 'src/chronomap/_snapshot.py'
              - 'tests/test_core_correctness.py'
            async_map:
              - 'src/chronomap/asynchronous.py'
              - 'tests/test_async_parity.py'
              - 'tests/test_memory_guardrails.py'
            persistence:
              - 'src/chronomap/persistence.py'
              - 'src/chronomap/_journal.py'
              - 'tests/test_persistence.py'
              - 'tests/test_journal.py'
              - 'tests/test_wal.py'
              - 'tests/test_wal_crash.py'
              - 'tests/test_wal_lock.py'
              - 'tests/test_pickle_fallback.py'
            cli:
              - 'src/chronomap/cli.py'
              - 'tests/test_cli.py'
              - 'tests/test_cli_commands.py'
            query:
              - 'src/chronomap/query.py'
              - 'tests/test_query.py'

  modules:
    name: "Subsystem: ${{ matrix.marker }}"
    needs: changes
    if: needs.changes.outputs.markers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        marker: ${{ fromJson(needs.changes.outputs.markers) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev + pandas extras
        run: pip install -e ".[dev,pandas]"

      - name: Run ${{ matrix.marker }} tests only
        run: pytest tests/ -v -m "${{ matrix.marker }}"

  test:
    name: Python ${{ matrix.python-version }} (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + pandas extras
        run: pip install -e ".[dev,pandas]"

      - name: Run tests
        run: pytest tests/ -v --cov=chronomap --cov-report=term-missing --cov-report=xml

      - name: Enforce 100% coverage
        if: matrix.python-version == '3.12'
        run: coverage report --fail-under=100

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  platform:
    name: ${{ matrix.os }} (Python 3.12, full suite)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev + pandas extras
        run: pip install -e ".[dev,pandas]"

      - name: Run tests with coverage
        run: pytest tests/ -q --cov=chronomap --cov-report=term-missing --cov-fail-under=100

  lint:
    name: Formatting (black)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install black
        run: pip install black>=23.0

      - name: Check formatting
        run: black --check src/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/chronomap --ignore-missing-imports

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents and import
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "chronomap/py.typed" in names
          assert "chronomap/core.py" in names
          print(f"verified {wheel}")
          PY
          python -m pip install dist/*.whl
          python -c "import chronomap; print(chronomap.__version__)"
